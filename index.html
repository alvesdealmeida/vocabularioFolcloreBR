<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Jogo educativo de vocabulário sobre o Folclore Brasileiro: 24 palavras em 6 rodadas cobrindo personagens, objetos, festas e ambientes.">
<meta name="author" content="Sebastião Alves de Almeida">
<title>Folclore Brasileiro 🌿 Vocabulário e Imagens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

:root {
  --bg:      #1A0D04;
  --gold:    #E8A020;
  --gold-lt: #F4C84A;
  --cream:   #F5E8D0;
  --green:   #18CC55;
  --red:     #FF3344;
  --border:  #7B5010;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 50%, rgba(80,40,0,.35) 0%, transparent 55%),
    radial-gradient(circle at 85% 20%, rgba(0,50,15,.3)  0%, transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(60,20,0,.2)  0%, transparent 40%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  color: var(--cream);
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* ── Header ─────────────────────────────────────── */
#appHeader {
  width: 100%;
  max-width: 880px;
  padding: 14px 20px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

#appHeader h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(18px, 3.8vw, 32px);
  color: var(--gold);
  text-shadow: 0 0 28px rgba(232,160,32,.5), 0 2px 4px rgba(0,0,0,.8);
  text-align: center;
  letter-spacing: 1px;
}

#appHeader .subtitle {
  font-size: clamp(10px, 2vw, 13px);
  color: rgba(245,232,208,.65);
  text-align: center;
}

/* ── Progress bar ───────────────────────────────── */
#progressBar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 5px 18px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(123,80,16,.5);
  border-radius: 50px;
  margin-top: 4px;
  flex-wrap: wrap;
}

#progressBar .pill {
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 4px;
}
#progressBar .pill .lbl { color: rgba(245,232,208,.5); font-size: 10px; font-weight: 600; }
#progressBar .pill .val { color: var(--gold-lt); }

.round-dots { display: flex; gap: 5px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(123,80,16,.5);
  border: 1.5px solid rgba(123,80,16,.8);
  transition: all .4s;
}
.dot.done   { background: var(--green); border-color: var(--green); box-shadow: 0 0 7px var(--green); }
.dot.active { background: var(--gold);  border-color: var(--gold);  box-shadow: 0 0 7px var(--gold); }

/* ── Category tag ───────────────────────────────── */
#categoryTag {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(12px, 2.2vw, 16px);
  color: var(--gold-lt);
  text-align: center;
  letter-spacing: .5px;
  padding: 4px 0 2px;
  text-shadow: 0 0 18px rgba(244,200,74,.4);
}

/* ── Instruction bar ────────────────────────────── */
#msgBar {
  font-size: clamp(11px, 2.2vw, 14px);
  font-weight: 700;
  text-align: center;
  padding: 6px 20px;
  margin: 3px 0;
  min-height: 30px;
  color: var(--cream);
  transition: color .3s;
}
#msgBar.ok  { color: var(--green); }
#msgBar.err { color: var(--red); }

/* ── Game area ──────────────────────────────────── */
#gameArea {
  width: 100%;
  max-width: 880px;
  padding: 0 12px 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.side-label {
  font-family: 'Fredoka One', cursive;
  font-size: 12px;
  color: var(--gold);
  text-align: center;
  letter-spacing: 1px;
  opacity: .65;
  margin-bottom: 5px;
}

#imgGrid, #wordGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

/* ── Image cards ────────────────────────────────── */
.img-card {
  border-radius: 15px;
  border: 2.5px solid var(--border);
  background: rgba(0,0,0,.4);
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.img-card:hover { transform: translateY(-3px); border-color: var(--gold); }

.img-card .card-svg  { width: 100%; aspect-ratio: 6/7; display: block; }
.img-card .card-clue {
  font-size: clamp(8px,1.4vw,10px);
  font-weight: 700;
  color: rgba(245,232,208,.72);
  text-align: center;
  padding: 5px 4px 6px;
  background: rgba(0,0,0,.5);
  line-height: 1.3;
  white-space: pre-line;
}

.img-card.selected {
  border-color: var(--gold-lt) !important;
  box-shadow: 0 0 0 3px var(--gold), 0 0 20px rgba(232,160,32,.5) !important;
  transform: scale(1.04) translateY(-2px);
}
.img-card.matched {
  border-color: var(--green) !important;
  box-shadow: 0 0 0 2.5px var(--green), 0 0 16px rgba(24,204,85,.4) !important;
  pointer-events: none;
}
.img-card.matched::after {
  content:'✓';
  position:absolute; top:6px; right:7px;
  font-size:16px; font-weight:900;
  color: var(--green);
  text-shadow: 0 0 10px var(--green);
}
.img-card.wrong { animation: shake .4s ease; border-color: var(--red) !important; }

/* ── Word cards ─────────────────────────────────── */
.word-card {
  border-radius: 13px;
  border: 2.5px solid var(--border);
  background: rgba(10,5,0,.6);
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 9px 7px;
  min-height: 62px;
  text-align: center;
}
.word-card:hover { transform: translateY(-2px); border-color: var(--gold); }

.word-card .wname {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(10px, 1.6vw, 14px);
  color: var(--cream);
  letter-spacing: .5px;
  line-height: 1.2;
}
.word-card .wicon { font-size: 18px; margin-bottom: 3px; }

.word-card.selected {
  border-color: var(--gold-lt) !important;
  background: rgba(232,160,32,.12) !important;
  box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(232,160,32,.4) !important;
  transform: scale(1.04) translateY(-2px);
}
.word-card.matched {
  border-color: var(--green) !important;
  background: rgba(24,204,85,.1) !important;
  box-shadow: 0 0 0 2px var(--green), 0 0 12px rgba(24,204,85,.35) !important;
  pointer-events: none;
}
.word-card.matched .wname { color: var(--green); }
.word-card.wrong { animation: shake .4s ease; border-color: var(--red) !important; }

/* ── Animations ─────────────────────────────────── */
@keyframes shake {
  0%,100%{ transform:translateX(0); }
  20%    { transform:translateX(-8px); }
  40%    { transform:translateX(8px); }
  60%    { transform:translateX(-5px); }
  80%    { transform:translateX(5px); }
}
@keyframes popIn {
  0%   { transform:scale(0.6); opacity:0; }
  70%  { transform:scale(1.06); }
  100% { transform:scale(1);   opacity:1; }
}
.img-card, .word-card { animation: popIn .35s ease both; }

/* ── Particle canvas ────────────────────────────── */
#particleCanvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 100;
}

/* ── Overlay ────────────────────────────────────── */
#overlay {
  position: fixed; inset: 0;
  background: rgba(10,5,0,.93);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 15px; z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity .4s; padding: 28px;
}
#overlay.visible { opacity:1; pointer-events:all; }

#overlay .ov-emoji  { font-size: 52px; }
#overlay .ov-badge  {
  font-size: clamp(10px,2vw,12px); font-weight: 800;
  background: rgba(123,80,16,.4); border: 1px solid var(--gold);
  padding: 4px 14px; border-radius: 20px; color: var(--gold);
  letter-spacing: 1px;
}
#overlay .ov-title  {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(20px,4.5vw,34px); color: var(--gold);
  text-shadow: 0 0 28px rgba(232,160,32,.6); text-align: center;
}
#overlay .ov-next   {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(14px,2.5vw,18px); color: rgba(245,232,208,.7);
  text-align: center;
}
#overlay .stars     { font-size: 38px; letter-spacing: 6px; }
#overlay .ov-msg    {
  font-size: clamp(13px,2.2vw,17px); font-weight: 700;
  color: rgba(245,232,208,.85); text-align: center;
  max-width: 420px; line-height: 1.6;
}
.ov-btn {
  background: linear-gradient(135deg, var(--gold), #CC7A00);
  color: #1A0D04; border: none; padding: 12px 30px;
  font-family: 'Fredoka One', cursive; font-size: 17px;
  border-radius: 13px; cursor: pointer;
  box-shadow: 0 4px 18px rgba(232,160,32,.4);
  transition: transform .15s, box-shadow .15s; letter-spacing: .5px;
}
.ov-btn:hover  { transform: scale(1.06) translateY(-2px); box-shadow: 0 8px 26px rgba(232,160,32,.55); }
.ov-btn:active { transform: scale(0.97); }

/* ── Credits ────────────────────────────────────── */
#credits {
  font-family: 'Fredoka One', cursive; font-size: 11px;
  color: rgba(245,232,208,.22); text-align: center;
  padding: 5px 0 12px; letter-spacing: .5px;
}

/* ── Responsive ─────────────────────────────────── */
@media (max-width: 640px) {
  #gameArea { grid-template-columns: 1fr; gap: 9px; }
  #imgGrid, #wordGrid { gap: 7px; }
  .side-label { font-size: 10px; }
  .round-dots { gap: 4px; }
  .dot { width: 8px; height: 8px; }
}
@media (max-width: 400px) {
  .word-card { min-height: 52px; }
}
</style>
</head>

  <p class="subtitle">Jogo de Vocabulário — Associe Imagens e Palavras</p>

    <div class="side-label">🖼️ IMAGENS</div>
    <div id="imgGrid"></div>
  </div>

    <div id="wordGrid"></div>
  </div>

<div id="credits">Desenvolvido por Sebastião Alves de Almeida</div>

<div id="overlay">

</div>

/* ══════════════════════════════════════════════════════════
   GAME STATE
══════════════════════════════════════════════════════════ */
let currentRound = 0;
let score        = 0;
let matched      = new Set();
let selectedImg  = null;
let selectedWord = null;
let roundItems   = [];
let locked       = false;

/* ══════════════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════════════ */
const pCanvas = document.getElementById('particleCanvas');
const pCtx    = pCanvas.getContext('2d');
let   pList   = [];

function resizePCanvas(){pCanvas.width=window.innerWidth;pCanvas.height=window.innerHeight;}
window.addEventListener('resize',resizePCanvas);
resizePCanvas();

function spawnParticles(x,y,color,n=18){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, spd=2+Math.random()*5;
    pList.push({x,y,dx:Math.cos(ang)*spd,dy:Math.sin(ang)*spd-2,r:3+Math.random()*6,color,alpha:1,decay:.02+Math.random()*.025,grav:.15});
  }
}

function particleLoop(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  for(let i=pList.length-1;i>=0;i--){
    const p=pList[i];
    p.x+=p.dx;p.y+=p.dy;p.dy+=p.grav;p.dx*=.96;p.alpha-=p.decay;
    if(p.alpha<=0){pList.splice(i,1);continue;}
    pCtx.globalAlpha=p.alpha;
    pCtx.beginPath();pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle=p.color;pCtx.fill();
  }
  pCtx.globalAlpha=1;
  requestAnimationFrame(particleLoop);
}
particleLoop();

/* ══════════════════════════════════════════════════════════
   UTILITY
══════════════════════════════════════════════════════════ */
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setMsg(text,type=''){const el=document.getElementById('msgBar');el.textContent=text;el.className=type;}

function updateHUD(){
  const rn=ROUNDS[currentRound];
  document.getElementById('rnVal').textContent    = `${currentRound+1} / ${ROUNDS.length}`;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('hitVal').textContent   = `${matched.size} / 4`;
  document.getElementById('categoryTag').textContent = `📚 Categoria: ${rn.category}`;
  const dots=document.getElementById('roundDots');
  dots.innerHTML='';
  for(let i=0;i<ROUNDS.length;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<currentRound?' done':i===currentRound?' active':'');
    dots.appendChild(d);
  }
}

/* ══════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════ */
function render(){
  const ig=document.getElementById('imgGrid'), wg=document.getElementById('wordGrid');
  ig.innerHTML=''; wg.innerHTML='';
  const imgOrder=shuffle([...Array(roundItems.length).keys()]);
  imgOrder.forEach((ci,delay)=>{
    const it=roundItems[ci];
    const card=document.createElement('div');
    card.className='img-card'; card.id='img-'+it.id;
    card.style.animationDelay=(delay*.07)+'s';
    card.innerHTML=`<div class="card-svg">${it.svg}</div><div class="card-clue">${it.clue}</div>`;
    card.addEventListener('click',()=>onImgClick(it.id));
    ig.appendChild(card);
  });
  const wordOrder=shuffle(roundItems.map(c=>c.id));
  wordOrder.forEach((id,delay)=>{
    const it=roundItems.find(c=>c.id===id);
    const card=document.createElement('div');
    card.className='word-card'; card.id='word-'+id;
    card.style.animationDelay=(delay*.09+.15)+'s';
    card.innerHTML=`<div class="wicon">${it.icon}</div><div class="wname">${it.name}</div>`;
    card.addEventListener('click',()=>onWordClick(id));
    wg.appendChild(card);
  });
  updateHUD();
  setMsg('Clique numa imagem e depois na palavra correta! 🍃');
}

/* ══════════════════════════════════════════════════════════
   INTERACTION
══════════════════════════════════════════════════════════ */
function onImgClick(id){
  if(locked||matched.has(id))return;
  if(selectedImg){const p=document.getElementById('img-'+selectedImg);if(p)p.classList.remove('selected');}
  selectedImg=id;
  document.getElementById('img-'+id).classList.add('selected');
  setMsg('Agora clique na palavra correspondente! 📜');
  if(selectedWord)tryMatch();
}

function onWordClick(id){
  if(locked||matched.has(id))return;
  if(selectedWord){const p=document.getElementById('word-'+selectedWord);if(p)p.classList.remove('selected');}
  selectedWord=id;
  document.getElementById('word-'+id).classList.add('selected');
  setMsg('Agora clique na imagem correspondente! 🖼️');
  if(selectedImg)tryMatch();
}

function tryMatch(){
  locked=true;
  const ie=document.getElementById('img-'+selectedImg), we=document.getElementById('word-'+selectedWord);
  if(selectedImg===selectedWord){
    matched.add(selectedImg); score+=10;
    ie.classList.remove('selected');ie.classList.add('matched');
    we.classList.remove('selected');we.classList.add('matched');
    const ir=ie.getBoundingClientRect(), wr=we.getBoundingClientRect();
    const cols=['#E8A020','#18CC55','#FFE050','#FF88AA','#00AAFF'];
    const col=cols[Math.floor(Math.random()*cols.length)];
    spawnParticles(ir.left+ir.width/2,ir.top+ir.height/2,col,22);
    spawnParticles(wr.left+wr.width/2,wr.top+wr.height/2,col,16);
    const it=roundItems.find(c=>c.id===selectedImg);
    setMsg(`✅ Correto! ${it.icon} ${it.name}!`,'ok');
    updateHUD();
    selectedImg=null;selectedWord=null;locked=false;
    if(matched.size===roundItems.length)setTimeout(showRoundComplete,600);
  } else {
    score=Math.max(0,score-3);
    ie.classList.remove('selected');ie.classList.add('wrong');
    we.classList.remove('selected');we.classList.add('wrong');
    setMsg('❌ Não é essa! Tente novamente...','err');
    setTimeout(()=>{
      ie.classList.remove('wrong');we.classList.remove('wrong');
      selectedImg=null;selectedWord=null;locked=false;
      setMsg('Clique numa imagem e depois na palavra correta! 🍃');
      updateHUD();
    },700);
  }
}

/* ══════════════════════════════════════════════════════════
   ROUND COMPLETE / GAME OVER
══════════════════════════════════════════════════════════ */
function showRoundComplete(){
  const isLast=currentRound===ROUNDS.length-1;
  const ov=document.getElementById('overlay');
  const maxScore=ROUNDS.length*4*10;
  if(isLast){
    const pct=score/maxScore;
    const stars=pct>.88?'⭐⭐⭐':pct>.65?'⭐⭐':'⭐';
    const msgs=['Continue estudando o folclore! 🌿','Muito bem! Você conhece bem a cultura! 🎉','Incrível! Mestre do Folclore Brasileiro! 🏆'];
    document.getElementById('ovEmoji').textContent  = '🏆';
    document.getElementById('ovBadge').textContent  = `JOGO COMPLETO`;
    document.getElementById('ovTitle').textContent  = '24 Palavras Aprendidas!';
    document.getElementById('ovStars').textContent  = stars;
    document.getElementById('ovNext').textContent   = '';
    document.getElementById('ovMsg').innerHTML      = `Pontuação final: <strong>${score}</strong> / ${maxScore} pontos!<br>${msgs[stars.length-1]}`;
    document.getElementById('ovBtn').textContent    = '↺ Jogar Novamente';
  } else {
    const next=ROUNDS[currentRound+1];
    document.getElementById('ovEmoji').textContent  = '🎉';
    document.getElementById('ovBadge').textContent  = `RODADA ${currentRound+1} COMPLETA`;
    document.getElementById('ovTitle').textContent  = ROUNDS[currentRound].title;
    document.getElementById('ovStars').textContent  = '';
    document.getElementById('ovNext').textContent   = `Próxima: ${next.title}`;
    document.getElementById('ovMsg').innerHTML      = `4 palavras novas aprendidas!<br>Pontuação: <strong>${score}</strong> pontos`;
    document.getElementById('ovBtn').textContent    = 'Próxima Rodada →';
  }
  ov.classList.add('visible');
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const x=80+Math.random()*(window.innerWidth-160);
      const y=40+Math.random()*(window.innerHeight-180);
      const c=['#E8A020','#18CC55','#FF3344','#00AAFF','#FF88FF','#FFEE00'][Math.floor(Math.random()*6)];
      spawnParticles(x,y,c,28);
    },i*220);
  }
}

function handleOverlayBtn(){
  const isLast=currentRound===ROUNDS.length-1;
  document.getElementById('overlay').classList.remove('visible');
  if(isLast){currentRound=0;score=0;loadRound();}
  else{currentRound++;loadRound();}
}

/* ══════════════════════════════════════════════════════════
   LOAD ROUND & START
══════════════════════════════════════════════════════════ */
function loadRound(){
  matched=new Set();selectedImg=null;selectedWord=null;locked=false;
  roundItems=ROUNDS[currentRound].items.map(i=>ITEMS[i]);
  render();
}

loadRound();
